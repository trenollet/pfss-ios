<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PFSS Secure Sign-In</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(32rem, calc(100% - 3rem)); text-align: center; }
    .icon { font-size: 3rem; }
    h1 { margin-bottom: .5rem; }
    p { color: color-mix(in srgb, CanvasText 65%, transparent); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🔒</div>
    <h1>PFSS Secure Sign-In</h1>
    <p>This staging site securely returns verified Owner sign-in to the PFSS app.</p>
  </main>
</body>
</html>
